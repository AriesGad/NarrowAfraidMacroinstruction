services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - PORT=3000
      - EXPO_NO_TELEMETRY=1
      - EXPO_NO_TYPESCRIPT_SETUP=1
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: sh -c "npm install -g pnpm@9 && pnpm install --no-frozen-lockfile && cd artifacts/aries-tunnel && pnpm exec expo start --web --port 3000"
    ports:
      - "3000:3000"
